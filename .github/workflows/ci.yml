name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ConfigModule valida esto al bootstrapear AppModule (lint/build no
      # necesitan una conexión real a Modal) — ModalService solo se
      # instancia, no se invoca, en lint/test/build/e2e (mismo motivo que
      # ANTHROPIC_API_KEY en Jin_Core).
      MODAL_TOKEN_ID: ci-not-a-real-token-id
      MODAL_TOKEN_SECRET: ci-not-a-real-token-secret
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run test:e2e
      # K3s real vía testcontainers (ADR 0003) — necesita Docker, que los
      # runners de ubuntu-latest traen. Más lento que los pasos de arriba
      # (pre-pull de imágenes + arranque de K3s-en-Docker).
      - run: pnpm run test:integration
      - run: pnpm run build
      - run: pnpm run generate:contract

  # Control que faltaba (docs/runbooks/STATUS_DEPLOY.md, Jin_Docs): el job
  # `docker` solo compila y publica, NUNCA ejecutaba la imagen -- por eso
  # llegó a GHCR una imagen con CMD apuntando a un archivo inexistente.
  # Acá se construye y se levanta de verdad; si no responde, el CI falla y
  # `docker` no publica. amd64 nativo a propósito (rápido).
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (solo para el smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: jin-executor:smoke
      - name: Arrancar el contenedor y esperar respuesta HTTP
        run: |
          docker run -d --name jin-smoke -p 3001:3001 \
            -e NODE_ENV=production \
            -e MODAL_TOKEN_ID=ci-not-a-real-id \
            -e MODAL_TOKEN_SECRET=ci-not-a-real-secret \
            jin-executor:smoke
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3001/; then
              echo
              echo "smoke OK: el Executor respondió 200"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' jin-smoke)" != "true" ]; then
              echo "el contenedor murió antes de responder"
              break
            fi
            sleep 2
          done
          echo "----- logs del contenedor -----"
          docker logs jin-smoke
          exit 1

  docker:
    needs: [build, container-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        # El nodo K3s real es Ampere/ARM64 (BLUEPRINT 3.1) — el runner de
        # Actions es amd64, así que necesitamos emulación para publicar
        # una imagen que el clúster pueda correr de verdad.
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Prohibido `latest` (Fase 7.1): tag único y determinista por
          # commit, para que Flux/rollback nunca sean ambiguos.
          tags: ghcr.io/jfrnck/jin-executor:${{ github.sha }}
