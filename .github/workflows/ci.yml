name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run test:e2e
      # K3s real vía testcontainers (ADR 0003) — necesita Docker, que los
      # runners de ubuntu-latest traen. Más lento que los pasos de arriba
      # (pre-pull de imágenes + arranque de K3s-en-Docker).
      - run: pnpm run test:integration
      - run: pnpm run build
      - run: pnpm run generate:contract
